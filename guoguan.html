<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#eef6f3">
<title>计算过关 · 五上数学</title>
<style>
/* 和"每日5题"同一套配色：薄荷绿 + 阳光黄，小数点用珊瑚红 */
:root{
  --bg:#eef6f3; --card:#fff; --ink:#1f2d3a; --muted:#526273; --line:#d8e6e1; --soft:#f4f9f7;
  --primary:#0f9d86; --primary-d:#0b7b69; --sun:#ffbf2f; --red:#e5533d; --red-bg:#fdeeeb; --ok-bg:#e2f5ef; --warn-bg:#fff6dc;
  --f:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --num:"DIN Alternate","Roboto",-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;min-height:36px}
.back{font-weight:700;color:var(--primary-d);text-decoration:none;padding:4px 10px 4px 0}
h1{margin:0;font-size:30px;line-height:1.2}
h1 b{color:var(--primary)}
h2{font-size:18px;margin:0}
h3{font-size:16px;margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:15px}
.card{background:var(--card);border-radius:16px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px;
  padding-top:max(8px,env(safe-area-inset-top,0px))}
.tabs a{text-align:center;text-decoration:none;color:var(--muted);font-weight:700;font-size:15px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 2px}
.tabs a.on{background:var(--primary);border-color:var(--primary);color:#fff}
.btn{display:block;width:100%;min-height:50px;border-radius:14px;font-size:17px;font-weight:700;padding:10px 16px;text-align:center;text-decoration:none}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-d)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-d)}
.btn.ghost{background:var(--card);border:2px solid var(--line);color:var(--primary-d)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 卷子选择 */
.sheets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sh{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:0}
.sh b{font:700 15px var(--f)}
.sh span{font:600 13px var(--num);color:var(--muted)}
.sh.full{background:var(--ok-bg);border-color:var(--primary)}
.sh.full span{color:var(--primary-d)}
.sh.on{outline:3px solid var(--sun);outline-offset:1px}
/* 题目 */
.sec-h{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.sec-h small{color:var(--muted)}
.tip{background:var(--warn-bg);border-radius:12px;padding:10px 12px;font-size:15px}
.qs{display:flex;flex-direction:column;gap:8px}
.q{background:var(--card);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:28px minmax(0,1fr) 120px;gap:6px 10px;align-items:center;border:2px solid transparent}
.q .no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:2px solid var(--line);font:700 13px var(--num)}
.q .ex{font:700 19px/1.3 var(--num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.q .ex small{display:block;font:500 12px var(--f);color:var(--muted)}
.q input{width:100%;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--soft);font:700 19px var(--num);text-align:center;padding:4px;color:var(--ink)}
.q input:focus{border-color:var(--primary);background:#fff;outline:none}
.q.ok{border-color:var(--primary)}
.q.ok .no{background:var(--primary);border-color:var(--primary);color:#fff}
.q.bad{border-color:var(--red)}
.q.bad .no{background:var(--red);border-color:var(--red);color:#fff}
.q.bad input{color:var(--red);text-decoration:line-through;border-color:var(--red);background:var(--red-bg)}
.q .fb{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.right{color:var(--primary-d);font-weight:700}
.wrongmsg{color:var(--red);font-weight:700}
.ans{font:700 17px var(--num);color:var(--red)}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--red);background:var(--red-bg);border-radius:6px;padding:0 6px;margin-right:4px}
.ty{display:inline-block;font-size:12px;font-weight:700;color:var(--primary-d);border:1.5px solid var(--primary);border-radius:6px;padding:0 5px;margin-right:6px;white-space:nowrap}
.ty.trap{color:var(--red);border-color:var(--red)}
details.how summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--primary-d);list-style:none;width:max-content}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"▸ "}
details.how[open] summary::before{content:"▾ "}
details.how ol{margin:6px 0 0;padding:8px 10px 8px 26px;background:var(--ok-bg);border-radius:10px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
details.how em{font-style:normal;color:var(--red);font-weight:700}
.chain{font-family:var(--num);overflow-wrap:anywhere}
.rep{position:relative;display:inline-block}
.rep::before{content:"";position:absolute;left:50%;top:-.05em;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.score{display:flex;align-items:center;gap:14px}
.score b{font:800 40px/1 var(--num);color:var(--primary-d)}
.score.low b{color:var(--red)}
/* 规律 */
.rule ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--primary-d);font-weight:700}
.trap{font-size:14.5px;background:var(--red-bg);border-radius:10px;padding:8px 10px}
.trap b{color:var(--red)}
.cues{display:flex;flex-direction:column;gap:10px}
.cues div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:start}
.cues .ty{text-align:center;margin:3px 0 0}
.rules{display:flex;flex-direction:column;gap:12px}
/* 专项 */
.drill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.drill .why{grid-column:1/-1;font-size:14px;color:var(--muted)}
.drill .mine{font-size:13px;color:var(--red);font-weight:700}
.go{background:var(--primary);color:#fff;font-weight:700;border-radius:10px;padding:8px 14px;white-space:nowrap}
/* 家长 */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.prow .ex{font:600 16px var(--num)}
.prow .warn,.prow details{grid-column:1/-1}
.prow .st{grid-column:1/-1;font-size:14px;color:var(--muted);font-family:var(--num)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:420px){
  .q{grid-template-columns:26px minmax(0,1fr) 104px}
  .q .ex{font-size:17px}
  .tabs a{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<template id="rules-tpl">  
  <p class="sub" style="margin-top:0">这8张卷子的192道题，全部是下面这几条规律。每道题背后的规律，都能在这里找到。</p>

  <div class="rules">
    <div class="card rule">
      <div class="eyebrow">规律一 · 小数乘法</div>
      <h3>先按整数乘，再数位数，最后点小数点</h3>
      <ol class="rl">
        <li><b>按整数乘：</b>先不管小数点，把两个数当整数相乘。6.2×2.5 → 62×25=1550</li>
        <li><b>数位数：</b>两个因数一共有几位小数，积就有几位小数。6.2有1位，2.5有1位，一共2位</li>
        <li><b>点小数点：</b>从积的右边往左数出这么多位，点上小数点。1550 → 15.50</li>
      </ol>
      <div class="trap"><b>特殊情况①：末尾有0。</b>先点小数点，再去掉末尾的0：15.50 → 15.5。顺序反了就会错。卷子里有12道这种题。</div>
      <div class="trap"><b>特殊情况②：位数不够。</b>0.04×0.12，按整数乘得48，要4位小数但48只有2位，前面补0 → 0.0048</div>
    </div>

    <div class="card rule">
      <div class="eyebrow">规律二 · 小数除法</div>
      <h3>除数先变整数，商的小数点对齐被除数的小数点</h3>
      <ol class="rl">
        <li><b>看除数：</b>除数是小数，先把除数和被除数的小数点向右移动相同的位数，让除数变成整数。59.8÷0.23 → 5980÷23（被除数位数不够，末尾补0）</li>
        <li><b>对齐：</b>商的小数点和移动后的被除数的小数点上下对齐</li>
        <li><b>每一位都要商：</b>不够商1就商0，不能跳过</li>
        <li><b>除到被除数末尾还有余数：</b>在余数后面添0，继续除</li>
      </ol>
      <div class="trap"><b>商0的三个位置：</b>开头不够除，个位或十分位商0（3.64÷52=0.07）；中间不够除，商0占位（14.21÷7=2.03）；最后落下0，商0不能丢（59.8÷0.23=260）</div>
      <div class="trap"><b>除不尽：</b>余数重复出现，就是循环小数（19.4÷12=1.6166…）。要保留两位小数，就除到第三位，再四舍五入（≈1.62）</div>
    </div>

    <div class="card rule">
      <div class="eyebrow">规律三 · 估算核对</div>
      <h3>算之前先估，算完一比，小数点错了马上发现</h3>
      <ol class="rl">
        <li><b>怎么估：</b>把每个数看成最接近的整十、整一或"一位数"。59.8÷0.23 ≈ 60÷0.2 = 300</li>
        <li><b>大小规律：</b>乘以大于1的数，积比原来大；乘以小于1的数，积比原来小。除以小于1的数，商比原来大；除以大于1的数，商比原来小</li>
        <li><b>核对：</b>答案和估算值应该是同一个数量级（都是几百，或都是零点几）。算出260，估算300，对；算出2.6，就是小数点错了</li>
      </ol>
    </div>

    <div class="card rule">
      <div class="eyebrow">规律四 · 简便计算</div>
      <h3>看到什么，就想到什么</h3>
      <div class="cues">
        <div><span class="ty">凑整</span><p>看到2.5、1.25、0.25、12.5、0.5、0.2，先找它的"好朋友"：2.5×4=10，1.25×8=10，0.25×4=1，12.5×8=100，0.5×2=1，0.2×5=1</p></div>
        <div><span class="ty">拆数</span><p>看到99、9.9、1.02、10.1这类接近整数的数，拆成"整数±一点点"：3.82×99=3.82×100−3.82</p></div>
        <div><span class="ty">藏着1</span><p>算式里有一个单独的数，它其实是"×1"：58.3+99×58.3=58.3×(1+99)</p></div>
        <div><span class="ty">提公因数</span><p>两个乘积相加减，里面有相同的因数，把它提出来：9.7×3.6+9.7×6.4=9.7×(3.6+6.4)</p></div>
        <div><span class="ty">先变形</span><p>两个乘积的数字很像，只是小数点位置不同，先用积不变规律变成一样：0.68×1.9=6.8×0.19</p></div>
        <div><span class="ty">连除</span><p>连续除以两个数，先把两个除数乘起来：2.1÷2.5÷0.4=2.1÷(2.5×0.4)=2.1÷1</p></div>
        <div><span class="ty trap">陷阱</span><p>括号里是乘法，不能用分配律：(2.5×1.5)×4=15。除法也不能拆开：20÷(0.2+0.05)≠20÷0.2+20÷0.05</p></div>
      </div>
    </div>
  </div>
</template>

function item(r){var x=DATA[r[0]][r[1]==='v'?'v':'s'][r[2]];return x}
function tagsOf(r){var x=item(r);if(r[1]==='v')return x.t.slice();var t=x.type;if(t.indexOf('陷阱')===0)t='陷阱题';if(t==='凑整（加法）')t='凑整';return [t]}
function ansHTML(a){var m=a.match(/^([^()]*)\(([^)]+)\)$/);if(!m)return a;var r=m[2].split('');return m[1]+r.map(function(c,i){return (i===0||i===r.length-1)?'<span class="rep">'+c+'</span>':c}).join('')+'…'}
function expand(a){var m=a.match(/^([^()]*)\(([^)]+)\)$/);if(!m)return a;var s=m[1];while(s.split('.')[1].length<8)s+=m[2];return s}
function norm(s){return String(s||'').replace(/\s/g,'').replace(/[。．]/g,'.').replace(/^\+/,'')}
function num(s){return /^\d*\.?\d+$/.test(s)||/^\d+\.$/.test(s)}
function canon(s){if(s.indexOf('.')<0)return s.replace(/^0+(?=\d)/,'');s=s.replace(/0+$/,'').replace(/\.$/,'');if(s.charAt(0)==='.')s='0'+s;return s.replace(/^0+(?=\d)/,'')}
function digits(s){return s.replace('.','').replace(/^0+/,'').replace(/0+$/,'')}
function judge(r,input){
  var x=item(r),s=norm(input);if(!s)return {ok:false,empty:true};
  if(!num(s))return {ok:false,msg:'只能填数字和小数点'};
  var a=x.a,c=canon(s);
  if(a.indexOf('(')>=0){
    var ex=expand(a),dec=(c.split('.')[1]||'');
    if(c===x.ap)return {ok:true};
    if(dec.length>=3&&ex.indexOf(c)===0)return {ok:true};
    if(digits(c)&&digits(x.ap).indexOf(digits(c))===0&&c!==x.ap)return {ok:false,dp:true};
    return {ok:false};
  }
  if(c===canon(a))return {ok:true};
  if(digits(c)===digits(a))return {ok:false,dp:true};
  return {ok:false};
}
function stepsHTML(r,open){
  var x=item(r),li;
  if(r[1]==='v')li=x.steps;
  else li=['<b>看到什么：</b>'+x.cue,'<b>用什么规律：</b>'+x.law,'<b>完整过程：</b><span class="chain">'+x.q+x.full+'</span>'];
  return '<details class="how"'+(open?' open':'')+'><summary>看步骤</summary><ol>'+li.map(function(l){return '<li>'+l+'</li>'}).join('')+'</ol></details>';
}
function ansText(r){var x=item(r);return ansHTML(x.a)+(x.ap?' <small>≈'+x.ap+'</small>':'')}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1800)}

/* ---------- 做卷子 ---------- */
function sheetRefs(k){var o=[];for(var i=0;i<16;i++)o.push([k,'v',i]);for(var j=0;j<8;j++)o.push([k,'s',j]);return o}
function startSet(title,refs,sheet){cur={title:title,refs:refs,inputs:{},res:{},judged:false,sheet:sheet||null};location.hash='#zuo';render();window.scrollTo(0,0)}
function wrongRefs(){return Object.keys(S.wrong).map(function(k){return k.split('|').map(function(v,i){return i===2?+v:v})})}
function renderZuo(){
  if(cur)return renderSet();
  var sh='';for(var k=1;k<=8;k++){var b=S.best[k];sh+='<button class="sh'+(b&&b.score===24?' full':'')+'" data-sheet="'+k+'"><b>练习'+k+'</b><span>'+(b?'最好 '+b.score+'/24':'还没做')+'</span></button>'}
  var wn=Object.keys(S.wrong).length;
  return '<section class="card"><h2>选一张卷子</h2><p class="sub">做完点"交卷"，马上判分；错题会自动打开详细步骤。</p><div class="sheets">'+sh+'</div></section>'+
   '<section class="card"><h2>我的错题本</h2><p class="sub">'+(wn?'还有 <b>'+wn+'</b> 道题没改对。重做时做对一次就移出错题本。':'错题本是空的，做卷子时错的题会自动放进来。')+'</p>'+
   (wn?'<button class="btn primary" data-act="wrong">重做错题（'+wn+'道）</button>':'')+'</section>'+
   '<p class="tip">做题前先估一估答案大约是多少（几百？几十？零点几？），算完对照一下，小数点就不容易错。</p>';
}
function qHTML(r,idx){
  var x=item(r),key=r.join('|'),res=cur.res[key],val=cur.inputs[key]||'';
  var cls=res?(res.ok?' ok':' bad'):'';
  var label=r[1]==='v'?'竖式':'简便';
  var fb='';
  if(res){
    if(res.ok)fb='<div class="fb"><span class="right">✓ 对了！</span>'+stepsHTML(r,false)+'</div>';
    else fb='<div class="fb"><span class="wrongmsg">'+(res.empty?'这题还没填。':res.dp?'✗ 数字对了，小数点位置错了！':'✗ 不对。')+'</span><span>正确答案：<span class="ans">'+ansText(r)+'</span></span>'+
      (tagsOf(r).length?'<span>'+tagsOf(r).map(function(t){return r[1]==='v'?'<span class="chip">'+t+'</span>':'<span class="ty'+(t==='陷阱题'?' trap':'')+'">'+t+'</span>'}).join('')+'</span>':'')+stepsHTML(r,true)+'</div>';
  }
  return '<div class="q'+cls+'"><span class="no">'+(idx+1)+'</span><span class="ex">'+x.q+'<small>练习'+r[0]+' · '+label+(r[2]+1)+(x.ap||x.a.indexOf('(')>=0?' · 除不尽保留两位小数':'')+'</small></span>'+
    '<input type="text" inputmode="decimal" autocomplete="off" id="in-'+key.replace(/\|/g,'-')+'" data-key="'+key+'" value="'+val.replace(/"/g,'')+'"'+(cur.judged?' readonly':'')+' aria-label="'+x.q+' 的答案">'+fb+'</div>';
}
function renderSet(){
  var vs=[],ss=[];cur.refs.forEach(function(r,i){(r[1]==='v'?vs:ss).push([r,i])});
  var head='<section class="card"><div class="sec-h"><h2>'+cur.title+'</h2><small>'+cur.refs.length+'题</small></div>';
  if(cur.judged){
    var n=0;cur.refs.forEach(function(r){if(cur.res[r.join('|')].ok)n++});
    head+='<div class="score'+(n<cur.refs.length*0.8?' low':'')+'"><b>'+n+'/'+cur.refs.length+'</b><span>'+(n===cur.refs.length?'全对！太棒了。':'错了 '+(cur.refs.length-n)+' 道。先自己看看错在哪，再点开步骤对照。')+'</span></div>';
  }else head+='<p class="sub">竖式题可以在草稿本上算，把答案填进格子。除不尽的题保留两位小数。</p>';
  head+='</section>';
  var body='';
  if(vs.length)body+='<div class="sec-h"><h3>竖式计算</h3></div><div class="qs">'+vs.map(function(p){return qHTML(p[0],p[1])}).join('')+'</div>';
  if(ss.length)body+='<div class="sec-h"><h3>简便计算</h3><small>先说出用什么方法，再算</small></div><div class="qs">'+ss.map(function(p){return qHTML(p[0],p[1])}).join('')+'</div>';
  var foot=cur.judged?
    '<div class="btns">'+(cur.refs.some(function(r){return !cur.res[r.join('|')].ok})?'<button class="btn primary" data-act="redo">只重做错的题</button>':'')+'<button class="btn ghost" data-act="home">返回选卷子</button></div>':
    '<button class="btn primary" data-act="submit">交卷判分</button><button class="btn ghost" data-act="home">先不做了</button>';
  return head+body+foot;
}
function submit(){
  var empty=cur.refs.filter(function(r){return !norm(cur.inputs[r.join('|')])}).length;
  if(empty&&!submit.confirm){submit.confirm=true;toast('还有 '+empty+' 题没填，再点一次就交卷');return}
  submit.confirm=false;
  var n=0;
  cur.refs.forEach(function(r){
    var key=r.join('|'),j=judge(r,cur.inputs[key]);cur.res[key]=j;
    if(j.ok){n++;delete S.wrong[key]}
    else{S.wrong[key]=1;tagsOf(r).forEach(function(t){S.tags[t]=(S.tags[t]||0)+1});if(j.dp)S.tags['小数点错了']=(S.tags['小数点错了']||0)+1}
  });
  if(cur.sheet){var b=S.best[cur.sheet];if(!b||n>b.score)S.best[cur.sheet]={score:n,date:new Date().toISOString().slice(0,10)}}
  save();cur.judged=true;render();window.scrollTo(0,0);
}

/* ---------- 规律 / 专项 / 对答案 ---------- */
function renderGuilv(){return '<div class="rules">'+document.getElementById('rules-tpl').innerHTML+'</div>'}
function renderZhuan(){
  function grp(title,obj){
    var keys=Object.keys(obj).sort(function(a,b){return obj[b].length-obj[a].length});
    return '<section class="card"><h2>'+title+'</h2>'+keys.map(function(t){var mine=S.tags[t]||0;
      return '<div class="drill"><div><b>'+t+'</b> <span class="sub">'+obj[t].length+'题</span>'+(mine?' <span class="mine">你错过'+mine+'次</span>':'')+'</div><button class="go" data-drill="'+title+'|'+t+'">练这一类</button><p class="why">'+(WHY[t]||'')+'</p></div>'}).join('<hr style="border:0;border-top:1px dashed var(--line);margin:4px 0">')+'</section>'}
  var dpn=S.tags['小数点错了']||0;
  return '<p class="tip">同一类题集中练，比一张一张往下做更容易记住规律。哪一类"你错过"的次数多，就先练哪一类。'+(dpn?'<br>你一共有 <b>'+dpn+'</b> 次是"数字对了、小数点错了"，做题时记得先估算。':'')+'</p>'+
    grp('竖式计算的易错点',LISTS.tags)+grp('简便计算的类型',LISTS.types);
}
function renderJia(){
  var sh='';for(var k=1;k<=8;k++)sh+='<button class="sh'+(String(k)===parentSheet?' on':'')+'" data-psheet="'+k+'"><b>练习'+k+'</b><span>答案</span></button>';
  var d=DATA[parentSheet];
  var v=d.v.map(function(x,i){var r=[parentSheet,'v',i];return '<div class="prow"><span class="ex">'+(i+1)+'. '+x.q+'</span><span class="ans">= '+ansText(r)+'</span>'+(x.t.length?'<span class="warn">'+x.t.map(function(t){return '<span class="chip">'+t+'</span>'}).join('')+'</span>':'')+stepsHTML(r,true)+'</div>'}).join('');
  var s=d.s.map(function(x,i){var r=[parentSheet,'s',i];return '<div class="prow"><span class="ex">'+(i+1)+'. '+x.q+'</span><span class="ans">= '+x.a+'</span><span class="st"><span class="ty'+(x.type.indexOf('陷阱')===0?' trap':'')+'">'+x.type+'</span>'+x.s+'</span>'+stepsHTML(r,true)+'</div>'}).join('');
  return '<section class="card"><h2>家长对答案</h2><p class="sub">对完只告诉孩子"错了几道"，让他自己找。红色小标签是这道题最容易错的地方。</p><div class="sheets">'+sh+'</div></section>'+
    '<section class="card"><h3>练习'+parentSheet+' · 竖式计算</h3>'+v+'</section><section class="card"><h3>练习'+parentSheet+' · 简便计算</h3>'+s+'</section>';
}

/* ---------- 路由 ---------- */
function viewName(){var h=(location.hash||'').slice(1);return ['zuo','guilv','zhuanxiang','jiazhang'].indexOf(h)>=0?h:'zuo'}
function render(){
  var v=viewName();
  Array.prototype.forEach.call(document.querySelectorAll('#tabs a'),function(a){a.classList.toggle('on',a.getAttribute('data-v')===v)});
  $v.innerHTML=v==='guilv'?renderGuilv():v==='zhuanxiang'?renderZhuan():v==='jiazhang'?renderJia():renderZuo();
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
$v.addEventListener('input',function(e){var k=e.target.getAttribute('data-key');if(k&&cur&&!cur.judged)cur.inputs[k]=e.target.value});
$v.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){var ins=$v.querySelectorAll('input:not([readonly])'),i=Array.prototype.indexOf.call(ins,e.target);if(ins[i+1])ins[i+1].focus();else e.target.blur()}});
$v.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var k=b.getAttribute('data-sheet');if(k){startSet('计算过关练习'+k,sheetRefs(k),k);return}
  var p=b.getAttribute('data-psheet');if(p){parentSheet=p;render();return}
  var d=b.getAttribute('data-drill');if(d){var g=d.split('|'),src=g[0].indexOf('易错')>=0?LISTS.tags:LISTS.types;startSet('专项：'+g[1],src[g[1]].map(function(x){return [x[0],x[1],x[2]]}));return}
  var a=b.getAttribute('data-act');
  if(a==='submit')submit();
  else if(a==='home'){cur=null;render();window.scrollTo(0,0)}
  else if(a==='wrong')startSet('重做错题',wrongRefs());
  else if(a==='redo'){var w=cur.refs.filter(function(r){return !cur.res[r.join('|')].ok});startSet(cur.title.replace(/^(重做：)?/,'重做：'),w)}
});
render();
</script>
