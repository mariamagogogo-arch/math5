<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#eef6f3">
<title>用字母表示数 · 五上数学</title>
<style>
/* 和"每日5题"同一套配色：薄荷绿 + 阳光黄；字母用紫色，让孩子一眼看出"藏起来的数" */
:root{
  --bg:#eef6f3; --card:#fff; --ink:#1f2d3a; --muted:#526273; --line:#d8e6e1; --soft:#f4f9f7;
  --primary:#0f9d86; --primary-d:#0b7b69; --sun:#ffbf2f; --sun-bg:#fff6dc; --red:#e5533d; --red-bg:#fdeeeb; --ok-bg:#e2f5ef;
  --letter:#6b4fd8; --letter-bg:#efeaff;
  --f:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --num:"DIN Alternate","Roboto",-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;min-height:36px;gap:8px}
.back{font-weight:700;color:var(--primary-d);text-decoration:none;padding:4px 10px 4px 0}
h1{margin:0;font-size:28px;line-height:1.25}
h1 b{color:var(--letter)}
h2{font-size:19px;margin:0;line-height:1.35}
h3{font-size:16px;margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:15px}
.card{background:var(--card);border-radius:16px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.L{color:var(--letter);font-weight:800;font-style:italic;font-family:Georgia,"Times New Roman",serif;padding:0 1px}
.box{display:inline-block;min-width:1.4em;height:1.3em;border:2px dashed var(--letter);border-radius:5px;vertical-align:-0.2em;background:var(--letter-bg)}
.eq{font:700 22px/1.5 var(--num);text-align:center;background:var(--soft);border-radius:12px;padding:10px;overflow-wrap:anywhere}
.btn{display:block;width:100%;min-height:50px;border-radius:14px;font-size:17px;font-weight:700;padding:10px 16px;text-align:center;text-decoration:none}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-d)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-d)}
.btn.ghost{background:var(--card);border:2px solid var(--line);color:var(--primary-d)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tip{background:var(--sun-bg);border-radius:12px;padding:10px 12px;font-size:15px}
/* 首页模块卡 */
.mod{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:14px;text-align:left;width:100%;border:2px solid transparent}
.mod .ic{width:52px;height:52px;border-radius:14px;background:var(--letter-bg);display:grid;place-items:center;font:800 italic 24px Georgia,serif;color:var(--letter)}
.mod b{display:block;font-size:17px}
.mod small{color:var(--muted);font-size:14px;line-height:1.4;display:block}
.badge{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.badge.done{background:var(--ok-bg);color:var(--primary-d)}
.badge.due{background:var(--sun-bg);color:#9a6a00}
/* 阶段条 */
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stg{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0 4px;border-bottom:4px solid var(--line)}
.stg.on{color:var(--primary-d);border-color:var(--primary)}
.stg.past{color:var(--primary-d);border-color:#9fd9cc}
/* 想一想卡片 */
.lc .k{font-size:13px;font-weight:700;color:var(--letter);letter-spacing:.06em}
.lc h2{font-size:21px}
.lc .body{display:flex;flex-direction:column;gap:10px;font-size:16.5px}
.rule-t{width:100%;border-collapse:collapse;font-size:16px}
.rule-t td{border-bottom:1px dashed var(--line);padding:6px 4px;text-align:center}
.rule-t td:first-child{font-weight:700}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--primary)}
/* 天平 */
.bal{display:flex;flex-direction:column;align-items:center;gap:10px}
.bal svg{width:100%;max-width:340px;height:auto}
#beam{transition:transform .5s ease;transform-origin:170px 60px}
.bal .msg{min-height:1.6em;font-weight:700;text-align:center}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.mini{border:2px solid var(--line);border-radius:12px;padding:8px;font-weight:700;background:var(--soft)}
.mini.ok{border-color:var(--primary);background:var(--ok-bg)}
.mini.no{border-color:var(--red);background:var(--red-bg)}
/* 例题 */
.wk{display:flex;flex-direction:column;gap:8px}
.wk .s{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;background:var(--soft);border-radius:12px;padding:10px}
.wk .s .n{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font:700 13px var(--num)}
.wk .s .m{font:700 18px var(--num);overflow-wrap:anywhere}
.wk .s p{font-size:15px;color:var(--muted)}
/* 题目与步骤 */
.qbox{background:var(--letter-bg);border-radius:14px;padding:12px 14px;font-size:17px;font-weight:600}
.qbox .eq{background:#fff;margin-top:6px}
.pic{background:#fff;border-radius:12px;padding:6px;display:flex;gap:4px;overflow-x:auto;align-items:flex-end}
.pic figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto}
.pic figcaption{font:700 12px var(--num);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:10px}
.st{border-left:4px solid var(--line);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:8px}
.st.cur{border-color:var(--sun)}
.st.ok{border-color:var(--primary)}
.st .p{font-weight:700}
.st .p small{display:block;font-weight:500;color:var(--muted);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);border-radius:12px;padding:10px 8px;font:700 16px var(--num);background:var(--soft);min-height:48px}
.opt.ok{border-color:var(--primary);background:var(--ok-bg);color:var(--primary-d)}
.opt.no{border-color:var(--red);background:var(--red-bg);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.inrow{display:flex;gap:8px;align-items:center}
.inrow .pre{font:700 18px var(--num);white-space:nowrap}
.inrow input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--soft);font:700 20px var(--num);text-align:center;color:var(--ink)}
.inrow input:focus{border-color:var(--primary);background:#fff;outline:none}
.inrow .go{background:var(--primary);color:#fff;font-weight:700;border-radius:12px;padding:0 16px;min-height:48px;white-space:nowrap}
.fb{font-size:15px;font-weight:700}
.fb.ok{color:var(--primary-d)}
.fb.no{color:var(--red)}
.fb.hint{color:#8a5a00;background:var(--sun-bg);border-radius:10px;padding:6px 10px;font-weight:600}
.sol{background:var(--ok-bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:15.5px}
.sol b{color:var(--primary-d)}
.sol .m{font:700 16px var(--num)}
.prog{font:700 14px var(--num);color:var(--muted)}
.score{display:flex;align-items:center;gap:14px}
.score b{font:800 40px/1 var(--num);color:var(--primary-d)}
.say{display:flex;flex-direction:column;gap:8px}
.say .qq{background:var(--letter-bg);border-radius:12px;padding:10px 12px;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;padding:6px 0}
.chk input{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (max-width:400px){.opts{grid-template-columns:1fr}.eq{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ================= 工具 ================= */
function r6(x){return Math.round(x*1e6)/1e6}
function f(x){return String(r6(x))}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function d1(a,b){return ri(a*10,b*10)/10}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function L(x){return '<span class="L">'+x+'</span>'}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daysSince(s){if(!s)return 999;var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);var n=new Date();n.setHours(0,0,0,0);return Math.round((n-d)/864e5)}
function parseIn(s){s=String(s||'').replace(/\s/g,'').replace(/[。．]/g,'.').replace(/[－—]/g,'-');if(!/^-?\d*\.?\d+$/.test(s))return null;return parseFloat(s)}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2000)}
function esc(s){return String(s).replace(/"/g,'&quot;')}

/* ================= 题目生成 =================
   每道题：{q:题目HTML, pic:图, steps:[{k:'c'选择|'n'填数, p:提示, o:选项, a:答案, h:错了的提示}], ans:最终答案, ansLabel, sol:[讲解]} */
var LET=['x','a','b','y','m'];
function opt4(correct,others){var o=shuffle([correct].concat(others));return {o:o,a:o.indexOf(correct)}}
function chooseStep(p,correct,others,h){var r=opt4(correct,others);return {k:'c',p:p,o:r.o,a:r.a,h:h}}
var G={
/* ---- 方程 ---- */
e_add:function(P){P=P||{};var l=P.l||pick(LET),x=P.x||d1(1,20),p=P.p||d1(1,15),s=r6(x+p);
  return {q:P.q||'解方程：', eq:L(l)+' + '+p+' = '+s, steps:[
    chooseStep(L(l)+' 身边有「+ '+p+'」，要让它走开，等号两边同时……','减去 '+p,['加上 '+p,'乘 '+p,'除以 '+p],'「+」的相反运算是「−」。两边都减去 '+p+'，天平才平。'),
    {k:'n',p:'两边同时减去 '+p+'：',pre:L(l)+' = ',a:x,h:s+' − '+p+' = ?'}],
    ans:x,ansPre:L(l)+' = ',sol:[L(l)+' + '+p+' = '+s,'两边同时减去 '+p,L(l)+' = '+s+' − '+p,L(l)+' = <b>'+f(x)+'</b>','检验：'+f(x)+' + '+p+' = '+s+' ✓']}},
e_sub:function(P){P=P||{};var l=P.l||pick(LET),x=P.x||d1(10,40),p=P.p||d1(1,9),s=r6(x-p);
  var eq=P.eq||(L(l)+' − '+p+' = '+s);
  return {q:P.q||'解方程：', eq:eq, steps:(P.pre||[]).concat([
    chooseStep(L(l)+' 身边有「− '+p+'」，要让它走开，等号两边同时……','加上 '+p,['减去 '+p,'乘 '+p,'除以 '+p],'「−」的相反运算是「+」。两边都加上 '+p+'。'),
    {k:'n',p:'两边同时加上 '+p+'：',pre:L(l)+' = ',a:x,h:s+' + '+p+' = ?'}]),
    ans:x,ansPre:L(l)+' = ',sol:[L(l)+' − '+p+' = '+s,'两边同时加上 '+p,L(l)+' = '+s+' + '+p,L(l)+' = <b>'+f(x)+'</b>','检验：'+f(x)+' − '+p+' = '+s+' ✓']}},
e_mul:function(P){P=P||{};var l=P.l||pick(LET),k=P.k||ri(2,9),x=P.x||d1(1,9),s=r6(k*x);
  return {q:P.q||'解方程（'+k+L(l)+' 就是 '+k+'×'+L(l)+'）：', eq:k+L(l)+' = '+s, steps:[
    chooseStep(L(l)+' 被「'+k+'×」粘住了，要让它走开，等号两边同时……','除以 '+k,['减去 '+k,'乘 '+k,'加上 '+k],'「×」的相反运算是「÷」。'+k+L(l)+' 是 '+k+' 乘 '+L(l)+'，所以两边除以 '+k+'。'),
    {k:'n',p:'两边同时除以 '+k+'：',pre:L(l)+' = ',a:x,h:s+' ÷ '+k+' = ?'}],
    ans:x,ansPre:L(l)+' = ',sol:[k+L(l)+' = '+s,'两边同时除以 '+k,L(l)+' = '+s+' ÷ '+k,L(l)+' = <b>'+f(x)+'</b>','检验：'+k+'×'+f(x)+' = '+s+' ✓']}},
e_div:function(P){P=P||{};var l=P.l||pick(LET),k=P.k||pick([2,3,4,5,2.5,3.5,1.5]),s=P.s||d1(1,6),x=r6(k*s);
  var eq=P.eq||(L(l)+' ÷ '+k+' = '+s);
  return {q:P.q||'解方程：', eq:eq, steps:(P.pre||[]).concat([
    chooseStep(L(l)+' 后面跟着「÷ '+k+'」，要让它走开，等号两边同时……','乘 '+k,['除以 '+k,'加上 '+k,'减去 '+k],'「÷」的相反运算是「×」。两边都乘 '+k+'。'),
    {k:'n',p:'两边同时乘 '+k+'：',pre:L(l)+' = ',a:x,h:s+' × '+k+' = ?'}]),
    ans:x,ansPre:L(l)+' = ',sol:[L(l)+' ÷ '+k+' = '+s,'两边同时乘 '+k,L(l)+' = '+s+' × '+k,L(l)+' = <b>'+f(x)+'</b>','检验：'+f(x)+' ÷ '+k+' = '+s+' ✓']}},
e_two:function(P){P=P||{};var l=P.l||pick(LET),k=P.k||ri(2,9),x=P.x||ri(2,20),c=P.c||ri(5,60),s=r6(k*x-c);
  if(s<=0)return G.e_two(P);
  return {q:P.q||'解方程（两步）：', eq:P.noeq?'':k+L(l)+' − '+c+' = '+s, steps:(P.pre||[]).concat([
    chooseStep('先让离 '+L(l)+' 远的「− '+c+'」走开（最后穿上的衣服最先脱），两边同时……','加上 '+c,['减去 '+c,'除以 '+k,'乘 '+k],'先处理外面的「− '+c+'」，它的相反运算是「+ '+c+'」。'),
    {k:'n',p:'两边同时加上 '+c+'：',pre:k+L(l)+' = ',a:r6(k*x),h:s+' + '+c+' = ?'},
    chooseStep('现在 '+L(l)+' 只被「'+k+'×」粘住了，两边同时……','除以 '+k,['乘 '+k,'减去 '+k,'加上 '+k],k+L(l)+' 是 '+k+' 乘 '+L(l)+'，用「÷」让它走开。'),
    {k:'n',p:'两边同时除以 '+k+'：',pre:L(l)+' = ',a:x,h:(k*x)+' ÷ '+k+' = ?'}]),
    ans:x,ansPre:L(l)+' = ',sol:[k+L(l)+' − '+c+' = '+s,'① 两边同时加上 '+c+'：'+k+L(l)+' = '+(k*x),'② 两边同时除以 '+k+'：'+L(l)+' = <b>'+x+'</b>','检验：'+k+'×'+x+' − '+c+' = '+s+' ✓']}},
e_sub2:function(P){P=P||{};var l='b',k=P.k||ri(3,9),j=P.j||ri(2,6),A=P.A||ri(5,20),x=P.x||ri(5,25),M=k*x-j*A;
  if(M<=0)return G.e_sub2(P);
  var g=G.e_two({l:l,k:k,x:x,c:j*A,noeq:1,pre:[{k:'n',p:'第一步：先把 '+L('a')+' = '+A+' 代进去。'+j+L('a')+' 就是 '+j+'×'+A+' =',pre:'',a:j*A,h:j+' × '+A+' = ?'}]});
  g.q='如果 '+k+L('b')+' − '+j+L('a')+' = '+L('m')+'，当 '+L('m')+' = '+M+'，'+L('a')+' = '+A+' 时，'+L('b')+' 等于多少？';
  g.eq=k+L('b')+' − '+j+'×'+A+' = '+M;
  g.sol=['代入：'+k+L('b')+' − '+j+'×'+A+' = '+M,k+L('b')+' − '+(j*A)+' = '+M,'两边同时加上 '+(j*A)+'：'+k+L('b')+' = '+(M+j*A),'两边同时除以 '+k+'：'+L('b')+' = <b>'+x+'</b>'];
  return g},
e_bra:function(P){P=P||{};var l=P.l||pick(['a','x']),x=P.x||ri(2,9),k=P.k||ri(2,6),d=P.d||ri(2,8),e=P.e||ri(1,5),c=d*e+k*x;
  return {q:P.q||'解方程（括号题）：', eq:'('+c+' − '+k+L(l)+') ÷ '+d+' = '+e, steps:[
    chooseStep('最外面是「÷ '+d+'」，先让它走开，两边同时……','乘 '+d,['除以 '+d,'减去 '+d,'加上 '+d],'整个括号被「÷ '+d+'」，相反运算是「× '+d+'」。'),
    {k:'n',p:'两边同时乘 '+d+'：',pre:c+' − '+k+L(l)+' = ',a:d*e,h:e+' × '+d+' = ?'},
    chooseStep(c+' − '+k+L(l)+' = '+(d*e)+' 里，'+k+L(l)+' 是减数。减数 = ……',c+' − '+(d*e),[c+' + '+(d*e),(d*e)+' − '+c,c+' × '+(d*e)],'想一想：10 − □ = 3，□ = 10 − 3。减数 = 被减数 − 差。'),
    {k:'n',p:'算一算：',pre:k+L(l)+' = ',a:c-d*e,h:c+' − '+(d*e)+' = ?'},
    {k:'n',p:'两边同时除以 '+k+'：',pre:L(l)+' = ',a:x,h:(c-d*e)+' ÷ '+k+' = ?'}],
    ans:x,ansPre:L(l)+' = ',sol:['('+c+' − '+k+L(l)+') ÷ '+d+' = '+e,'① 两边乘 '+d+'：'+c+' − '+k+L(l)+' = '+(d*e),'② 减数 = 被减数 − 差：'+k+L(l)+' = '+c+' − '+(d*e)+' = '+(c-d*e),'③ 两边除以 '+k+'：'+L(l)+' = <b>'+x+'</b>','检验：('+c+' − '+k+'×'+x+') ÷ '+d+' = '+e+' ✓']}},
e_rsub:function(P){P=P||{};var l=P.l||pick(['x','t','a']),k=P.k||pick([1,1,2,3,4]),x=P.x||ri(2,15),c=P.c||r6(k*x+ri(3,40)),s=r6(c-k*x),kl=(k>1?k:'')+L(l);
  var st=[chooseStep(L(l)+' 在「−」后面，被减掉了。先把它请回来：等号两边同时……','加上 '+kl,['减去 '+kl,'加上 '+c,'减去 '+s],'两边都加上 '+kl+'：左边 '+c+' − '+kl+' + '+kl+' = '+c+'，右边变成 '+s+' + '+kl+'。'),
    chooseStep('现在变成 '+c+' = '+s+' + '+kl+'。要让 '+kl+' 单独留下，两边同时……','减去 '+s,['加上 '+s,'减去 '+c,'除以 '+s],kl+' 身边是「+ '+s+'」，用「−」让它走开。'),
    {k:'n',p:'两边同时减去 '+s+'：',pre:kl+' = ',a:r6(c-s),h:c+' − '+s+' = ?'}];
  if(k>1)st.push(chooseStep(kl+' 是 '+k+'×'+L(l)+'，两边同时……','除以 '+k,['乘 '+k,'减去 '+k,'加上 '+k],'「×」的相反运算是「÷」。'),{k:'n',p:'两边同时除以 '+k+'：',pre:L(l)+' = ',a:x,h:f(c-s)+' ÷ '+k+' = ?'});

function pat(c){

    {k:'n',p:'',pre:lab(3),a:c.cnt(3),h:'第3个比第2个又多了几'+c.unit+'？'},
    {k:'n',p:'每多一'+c.item+'，就多几'+c.unit+'？'+(c.note?'<small>'+c.note+'</small>':''),pre:'每次多：',a:c.d,h:c.cnt(2)+' − '+c.cnt(1)+' = ?'},
    chooseStep('每次多 '+c.d+'，就是「'+c.d+'×n」。第1个是 '+c.cnt(1)+'，'+c.d+'×1 = '+c.d+'，还要'+(c.b>=0?'补 '+c.b:'减 '+(-c.b))+'。所以第 n 个是……',F,wrong,'用第2个检验：'+c.d+'×2'+bs(1)+' 应该等于 '+c.cnt(2)+'。')
  ];

  asks.forEach(function(a){

      sol.push(F+' = '+a.T+' → n = ('+a.T+(c.b>=0?' − '+c.b:' + '+(-c.b))+') ÷ '+c.d+(rem?' = '+q+' …… '+rem+'，最多 <b>'+q+'</b>':' = <b>'+q+'</b>'));ans=q;ansPre='n = ';qs.push('有 '+a.T+' '+c.unit+'时，'+(rem?'最多':'')+'是第几个？')}

function drawHexSeats(n){
  var R=18,dx=R*Math.sqrt(3),o='',cy=R+12,cx0=R+12,i,k;
  for(i=0;i<n;i++){var cx=cx0+i*dx,pts=[];for(k=0;k<6;k++){var t=(-90+60*k)*Math.PI/180;pts.push([cx+R*Math.cos(t),cy+R*Math.sin(t)])}
    o+='<polygon points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="#fdf3e3" stroke="#1f2d3a" stroke-width="1.4"/>';
    for(k=0;k<6;k++){var a=pts[k],b=pts[(k+1)%6];
      if(k===1&&i<n-1)continue; if(k===4&&i>0)continue;
      var mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nx=mx-cx,ny=my-cy,L2=Math.sqrt(nx*nx+ny*ny);nx/=L2;ny/=L2;
      [0.27,0.73].forEach(function(f){var px=a[0]+(b[0]-a[0])*f+nx*8,py=a[1]+(b[1]-a[1])*f+ny*8;o+=seat(px,py)})}}

function drawFish(n){

  segs.forEach(function(s){o+='<line x1="'+s[0][0]+'" y1="'+s[0][1]+'" x2="'+s[1][0]+'" y2="'+s[1][1]+'" stroke="#c98a3a" stroke-width="2.6" stroke-linecap="round"/>'});

function stepHTML(st,i,q,pfx){

  else{h+='<div class="inrow"><span class="pre">'+(st.pre||'')+'</span>'+(done?'<span class="pre" style="color:var(--primary-d)">'+f(st.a)+' ✓</span>':'<input type="text" inputmode="decimal" autocomplete="off" id="in-'+pfx+'-'+i+'" aria-label="填答案"><button class="go" data-num="'+pfx+'|'+i+'">确定</button>')+'</div>'}

function guidedHTML(q,pfx){

  for(var i=0;i<=Math.min(q.cur,p.steps.length-1);i++)h+=stepHTML(p.steps[i],i,q,pfx);
  h+='</div>';
  if(q.cur>=p.steps.length)h+='<div class="sol"><b>✓ 完成！整理一下：</b>'+p.sol.map(function(s){return '<span class="m">'+s+'</span>'}).join('')+'</div>';
  return h+'</section>';
}
function stepAnswer(q,i,val,isPick){
  var st=q.p.steps[i];if(i!==q.cur)return;
  var ok=isPick?(val===st.a):(function(){var v=parseIn(val);return v!==null&&Math.abs(v-st.a)<1e-9})();
  if(!isPick&&parseIn(val)===null){q.msg='请填一个数。';q.msgc='no';return}
  if(ok){q.cur++;q.tries=0;q.bad=[];q.msg='';}
  else{q.tries++;q.wrongAny=true;if(isPick){q.bad=(q.bad||[]).concat([val])}
    if(q.tries>=2&&st.k==='n'){q.msg='正确答案是 '+f(st.a)+'。记住这一步，接着往下做。';q.msgc='hint';q.cur++;q.tries=0;q.bad=[];q.helped=true}
    else{q.msg='再想想：'+st.h;q.msgc='hint'}}
}

/* ================= 事件 ================= */
function curQ(pfx){return pfx==='g'?V.guided[V.gi]:pfx==='s'?V.solo[V.si]:V.items[V.i]}
function markWrong(g){S.wrong[g]=(S.wrong[g]||0)+1;save()}
function markRight(g){if(S.wrong[g]){S.wrong[g]--;if(S.wrong[g]<=0)delete S.wrong[g];save()}}
app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var mod=b.getAttribute('data-mod');if(mod){openMod(mod);return}
  var bal=b.getAttribute('data-bal');if(bal){var beam=document.getElementById('beam'),msg=document.getElementById('balmsg');
    Array.prototype.forEach.call(document.querySelectorAll('[data-bal]'),function(x){x.className='mini'});
    if(bal==='one'){beam.style.transform='rotate(-9deg)';document.getElementById('lt').textContent='x';document.getElementById('rt').textContent='10';msg.textContent='歪了！只动一边，两边就不一样重了。';msg.style.color='var(--red)';b.className='mini no'}
    else{beam.style.transform='rotate(0deg)';document.getElementById('lt').textContent='x';document.getElementById('rt').textContent='7';msg.textContent='平了！x = 7。两边做一样的事，天平不歪。';msg.style.color='var(--primary-d)';b.className='mini ok'}return}
  var sq=b.getAttribute('data-sq');if(sq){var m2=document.getElementById('sqmsg');Array.prototype.forEach.call(document.querySelectorAll('[data-sq]'),function(x){x.className='mini'});
    b.className='mini '+(sq==='ok'?'ok':'no');m2.className='msg fb '+(sq==='ok'?'ok':'no');m2.textContent=sq==='ok'?'对！平方是两个相同的数相乘。':'这是很多同学会犯的错：平方不是乘2！';return}
  var pk=b.getAttribute('data-pick');if(pk){var a=pk.split('|'),q=curQ(a[0]);stepAnswer(q,+a[1],+a[2],true);afterStep(a[0]);return}
  var nm=b.getAttribute('data-num');if(nm){var a2=nm.split('|'),q2=curQ(a2[0]),inp=document.getElementById('in-'+a2[0]+'-'+a2[1]);stepAnswer(q2,+a2[1],inp?inp.value:'',false);afterStep(a2[0]);return}
  var act=b.getAttribute('data-act');if(!act)return;
  if(act==='home'){go({view:'home'})}
  else if(act==='nextcard'){if(V.card<MODS[V.id].learn.length-1)V.card++;else V.stage=1;render();window.scrollTo(0,0)}
  else if(act==='prevcard'){V.card--;render()}
  else if(act==='nextex'){V.ex++;render()}
  else if(act==='tostage'){V.stage=+b.getAttribute('data-s');render();window.scrollTo(0,0)}
  else if(act==='nextg'){V.gi++;render();window.scrollTo(0,0)}
  else if(act==='checksolo'||act==='checkset'){var s=act==='checksolo'?V.solo[V.si]:V.items[V.i],val=document.getElementById('solo-in').value,v=parseIn(val);
    if(v===null){toast('请填一个数');return}
    s.val=val;s.res=Math.abs(v-s.p.ans)<1e-9?'ok':'no';
    var gname=s.g;if(gname){if(s.res==='ok')markRight(gname);else markWrong(gname)}
    render()}
  else if(act==='toguided'){var s1=V.solo[V.si];s1.mode='guided';s1.cur=0;render()}
  else if(act==='toguidedt'){var s2=V.items[V.i];s2.mode='guided';s2.cur=0;render()}
  else if(act==='nexts'){V.si++;render();window.scrollTo(0,0)}
  else if(act==='nextt'){V.i++;if(V.i>=V.items.length&&V.review){Object.keys(MODS).forEach(function(id){if(isDue(id)){var m=S.mods[id];m.stage=(m.stage||0)+1;m.last=today()}});save()}render();window.scrollTo(0,0)}
  else if(act==='relearn'){V.stage=0;V.card=0;render();window.scrollTo(0,0)}
  else if(act==='finish'){var m=S.mods[V.id]=S.mods[V.id]||{};if(!m.done){m.done=true;m.stage=0}m.last=today();save();toast('完成！过几天会提醒你复习。');go({view:'home'})}
  else if(act==='review'){var it=reviewItems();if(!it.length){toast('今天没有要复习的');return}openSet('复习 · 换个数字再做',it)}
  else if(act==='tset2'){openSet('练习：用式子表示规律',setPat().map(function(x){return {mod:x.mod,p:x.p,mode:'guided'}}))}
  else if(act==='tset3'){openSet('练习：等式的性质',setEq().map(function(x){return {mod:x.mod,p:x.p,mode:'guided'}}))}
  else if(act==='weekend'){openSet('老师的周末小练 1',weekendSet().map(function(x){return {mod:x.mod,p:x.p,mode:'guided'}}))}
});
function afterStep(pfx){
  var q=curQ(pfx);
  if(q.cur>=q.p.steps.length&&q.wrongAny&&pfx!=='g'&&q.g){/* 自己做/复习里切到分步做的题，已经记过错 */}
  render();
  var nx=document.querySelector('.st.cur input');if(nx)nx.focus({preventScroll:true});
}
app.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  var row=e.target.closest('.inrow');var btn=row&&row.querySelector('button');if(btn)btn.click();
});
function bindAfter(){}
render();
</script>
</body>
</html>
